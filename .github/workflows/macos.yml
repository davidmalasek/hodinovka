# Testy, sestavení Hodinovka.app na macOS (okno aplikace jde zkompilovat jen na Macu) a zkouška
# aplikace ke stažení. Když je v main v souboru VERSION číslo, které ještě nevyšlo, vydá se nová
# verze s Hodinovka.zip a Hodinovka si ji u ostatních při dalším otevření sama stáhne.
name: macOS
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testy
        run: python3 -m unittest discover tests
      - name: Vývojová instalace
        run: bash instalovat.sh "$RUNNER_TEMP"
      - name: Sestavení Hodinovka.zip
        run: |
          bash macos/sestavit.sh "$RUNNER_TEMP/vydani/Hodinovka.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/vydani/Hodinovka.app" "$RUNNER_TEMP/Hodinovka.zip"
      - name: Zkouška Hodinovka.zip jako po stažení
        run: |
          support="$HOME/Library/Application Support/Hodinovka"
          ditto -x -k "$RUNNER_TEMP/Hodinovka.zip" "$RUNNER_TEMP/stazeno"
          open "$RUNNER_TEMP/stazeno/Hodinovka.app"
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8766/api/version && break; sleep 1; done
          cat "$support/data/server.log" || true
          curl -sf http://localhost:8766/api/version
          pgrep -x Hodinovka
          test -f "$HOME/Library/Application Support/MejvOS/apps/hodinovka.json"  # přihlásila se do MejvOS
          test -f "$HOME/Library/Application Support/MejvOS/contacts/hodinovka.json"
          test ! -e "$support/python"  # Python na runneru je, nic se nestahovalo
          pkill -x Hodinovka
          kill "$(cat "$support/data/server.pid")"
      - name: Zkouška stažení vlastního Pythonu (Mac bez Pythonu)
        run: |
          support="$HOME/Library/Application Support/Hodinovka"
          HODINOVKA_APP=zkouska HODINOVKA_STAHNOUT_PYTHON=1 bash "$support/spustit.sh"
          curl -sf http://localhost:8766/api/version
          ps -o command= -p "$(cat "$support/data/server.pid")" | grep -F "python/bin/python3 server.py"
          # certifikáty (ARES, aktualizace a instalace Faktur jdou přes HTTPS)
          SSL_CERT_FILE="$support/python/cacert.pem" "$support/python/bin/python3" -c \
            "import urllib.request; urllib.request.urlopen('https://github.com', timeout=20); print('HTTPS v pořádku')"
          kill "$(cat "$support/data/server.pid")"
      - uses: actions/upload-artifact@v4
        with:
          name: Hodinovka
          path: ${{ runner.temp }}/Hodinovka.zip

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Hodinovka
      - name: Vydání nové verze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Verze $version už vyšla."
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          git log --pretty='- %s' ${previous:+"$previous"..}HEAD > notes.md
          gh release create "v$version" Hodinovka.zip --title "Hodinovka $version" --notes-file notes.md --target "$GITHUB_SHA"
